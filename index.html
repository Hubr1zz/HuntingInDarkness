<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hunting in Darkness</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Cormorant+SC:wght@300;400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 固定页眉：书名 · 当前章节 · 页码 -->
<header class="running" aria-hidden="true">
  <span class="running__book" data-i18n="ui.book"></span>
  <span class="running__chapter" id="runningChapter" data-i18n-dynamic></span>
  <span class="running__page" id="runningPage" data-i18n-dynamic></span>
</header>
<button type="button" class="lang-toggle" id="langToggle" data-i18n-attr="aria-label:ui.langToggle"><span data-lang="zh" data-i18n="ui.lang.zh"></span><span data-lang="en" data-i18n="ui.lang.en"></span></button>

<a class="skip" id="skipPrologue" href="#contents" data-i18n="ui.skip"></a>

<!-- 切换章节时的翻页色幕 -->
<div class="turn" id="turn" aria-hidden="true"></div>

<main>

<!-- ============ 封面 ============ -->
<section class="cover" data-chapter-key="" data-nopage>
  <div class="cover__skull" aria-hidden="true"><img src="assets/skull-butterfly.webp" alt="" width="685" height="856"></div>
  <div class="cover__mark">
    <div class="cover__ring" aria-hidden="true"></div>
    <h1 class="cover__title" data-i18n="cover.title"></h1>
  </div>
  <a class="cover__cue" href="#hero" data-i18n="cover.cue"></a>
</section>

<!-- ============ 首屏 ============ -->
<section class="hero" id="hero" data-chapter-key="">
  <div class="slot slot--bleed" data-asset="H-01" data-label-key="slot.H-01" data-ratio="16/9" data-fallback="assets/existing/procession.webp" data-fallback-alt-key="slot.procession.alt"></div>
  <div class="hero__shade" aria-hidden="true"></div>
  <div class="hero__text">
    <p class="kicker kicker--light" data-i18n="hero.kicker"></p>
    <h2 class="hero__title" data-i18n="hero.title"></h2>
    <ul class="hero__tone" data-i18n-attr="aria-label:hero.toneLabel"><li data-i18n="hero.tone.1"></li><li data-i18n="hero.tone.2"></li><li data-i18n="hero.tone.3"></li></ul>
    <p class="hero__lede" data-i18n="hero.lede"></p>
    <div class="hero__cta">
      <a class="btn btn--light" href="#/contact" data-i18n="hero.cta.follow"></a>
      <a class="btn btn--ghost" href="#/contact" data-i18n="hero.cta.partner"></a>
    </div>
  </div>
</section>

<!-- ============ 序章（内核钩子）：黑屏出字 → 遮幅拉开画面 ============ -->
<div id="prologue">
  <section class="film" data-chapter-key="chapter.prologue">
    <div class="film__stage">
      <div class="slot slot--bleed slot--dark" data-asset="P-01" data-label-key="slot.P-01" data-ratio="16/9"></div>
      <div class="film__bar film__bar--top"></div><div class="film__bar film__bar--bottom"></div>
      <p class="film__line"><span><span class="film__initial" data-i18n="prologue.1.initial"></span><span data-i18n="prologue.1.rest"></span></span></p>
      <p class="film__caption" data-i18n="prologue.1.caption"></p>
    </div>
  </section>
  <section class="film" data-chapter-key="chapter.prologue">
    <div class="film__stage">
      <div class="slot slot--bleed slot--dark" data-asset="P-02" data-label-key="slot.P-02" data-ratio="16/9"></div>
      <div class="film__bar film__bar--top"></div><div class="film__bar film__bar--bottom"></div>
      <p class="film__line"><span data-i18n="prologue.2.line"></span></p>
      <p class="film__caption" data-i18n="prologue.2.caption"></p>
    </div>
  </section>
  <section class="film" data-chapter-key="chapter.prologue">
    <div class="film__stage">
      <div class="slot slot--bleed slot--dark" data-asset="P-03" data-label-key="slot.P-03" data-ratio="16/9"></div>
      <div class="film__bar film__bar--top"></div><div class="film__bar film__bar--bottom"></div>
      <p class="film__line"><span data-i18n="prologue.3.line"></span></p>
      <p class="film__caption" data-i18n="prologue.3.caption"></p>
    </div>
  </section>
  <section class="film" data-chapter-key="chapter.prologue">
    <div class="film__stage">
      <div class="slot slot--bleed slot--dark" data-asset="P-04" data-label-key="slot.P-04" data-ratio="16/9"></div>
      <div class="film__bar film__bar--top"></div><div class="film__bar film__bar--bottom"></div>
      <p class="film__line"><span data-i18n="prologue.4.line"></span></p>
      <p class="film__caption" data-i18n="prologue.4.caption"></p>
    </div>
  </section>
</div>

<!-- ============ 目录 ============ -->
<section class="contents page" id="contents" data-chapter-key="chapter.contents">
  <div class="title-block" data-reveal>
    <p class="kicker" data-i18n="contents.kicker"></p>
    <h2 class="title-en" data-i18n="contents.titleEn"></h2>
    <p class="title-cn" data-i18n="contents.titleCn"></p>
  </div>
  <ol class="contents__list">
    <li data-reveal style="--dot: var(--ch1-dot)">
      <a href="#/gameplay">
        <div class="contents__emblem"><div class="slot slot--emblem slot--framed" data-asset="E-01" data-label-key="slot.E-01" data-ratio="1/1"></div></div>
        <div class="contents__meta">
          <span class="contents__num"><i class="dot"></i><span data-i18n="contents.1.num"></span></span>
          <strong data-i18n="contents.1.name"></strong>
          <span data-i18n="contents.1.desc"></span>
        </div>
      </a>
    </li>
    <li data-reveal style="--dot: var(--ch2-dot)">
      <a href="#/core">
        <div class="contents__emblem"><div class="slot slot--emblem slot--framed" data-asset="E-02" data-label-key="slot.E-02" data-ratio="1/1"></div></div>
        <div class="contents__meta">
          <span class="contents__num"><i class="dot"></i><span data-i18n="contents.2.num"></span></span>
          <strong data-i18n="contents.2.name"></strong>
          <span data-i18n="contents.2.desc"></span>
        </div>
      </a>
    </li>
    <li data-reveal style="--dot: var(--ch3-dot)">
      <a href="#/art">
        <div class="contents__emblem"><div class="slot slot--emblem slot--framed" data-asset="E-03" data-label-key="slot.E-03" data-ratio="1/1"></div></div>
        <div class="contents__meta">
          <span class="contents__num"><i class="dot"></i><span data-i18n="contents.3.num"></span></span>
          <strong data-i18n="contents.3.name"></strong>
          <span data-i18n="contents.3.desc"></span>
        </div>
      </a>
    </li>
  </ol>
</section>

<!-- ======================================================
     章节：页签栏 + 一次只显示一章
     ====================================================== -->
<div class="chapters" id="chapters">
<nav class="tabs" data-i18n-attr="aria-label:tabs.label">
  <span class="tabs__book" data-i18n="ui.book"></span>
  <div class="tabs__list" role="tablist">
    <a class="tabs__tab" role="tab" href="#/gameplay" data-route="gameplay" style="--dot: var(--ch1-dot)"><i class="dot"></i><span class="tabs__num" data-i18n="tabs.gameplay.num"></span><span data-i18n="tabs.gameplay"></span></a>
    <a class="tabs__tab" role="tab" href="#/core" data-route="core" style="--dot: var(--ch2-dot)"><i class="dot"></i><span class="tabs__num" data-i18n="tabs.core.num"></span><span data-i18n="tabs.core"></span></a>
    <a class="tabs__tab" role="tab" href="#/art" data-route="art" style="--dot: var(--ch3-dot)"><i class="dot"></i><span class="tabs__num" data-i18n="tabs.art.num"></span><span data-i18n="tabs.art"></span></a>
    <a class="tabs__tab" role="tab" href="#/contact" data-route="contact" style="--dot: var(--grey)"><i class="dot"></i><span data-i18n="tabs.contact"></span></a>
  </div>
  <span class="tabs__page" id="tabsPage" data-i18n-dynamic></span>
</nav>

<!-- ============ 第一章 玩法 ============ -->
<article class="chapter" id="ch1" role="tabpanel" data-route="gameplay" style="--turn: var(--ch1)">
<section class="door" data-chapter-key="chapter.gameplay" style="--door: var(--ch1)">
  <div class="door__pattern" data-pattern="T-01"></div>
  <div class="door__emblem"><div class="slot slot--emblem slot--on-dark" data-asset="E-01" data-label-key="slot.E-01" data-ratio="1/1"></div></div>
  <p class="door__num" data-i18n="ch1.door.num"></p>
  <h2 class="door__title"><span class="title-en" data-i18n="ch1.door.titleEn"></span><span class="title-cn" data-i18n="ch1.door.titleCn"></span></h2>
</section>

<!-- 概览：战役结构 + 主循环图 -->
<section class="overview page" data-chapter-key="chapter.gameplay">
  <div class="overview__head">
    <div>
      <p class="kicker" data-i18n="ch1.overview.kicker"></p>
      <h3 class="overview__title" data-i18n="ch1.overview.title"></h3>
    </div>
    <div>
      <p class="overview__lede" data-i18n="ch1.overview.lede"></p>
      <p data-i18n="ch1.overview.body"></p>
    </div>
  </div>

  <div class="campaign" data-reveal>
    <ol class="campaign__steps">
      <li><span class="campaign__num" data-i18n="ch1.campaign.1.num"></span><span data-i18n="ch1.campaign.1"></span></li>
      <li><span class="campaign__num" data-i18n="ch1.campaign.2.num"></span><span data-i18n="ch1.campaign.2"></span></li>
      <li><span class="campaign__num" data-i18n="ch1.campaign.3.num"></span><span data-i18n="ch1.campaign.3"></span></li>
    </ol>
    <p class="campaign__contains" data-i18n="ch1.campaign.contains"></p>
  </div>

  <figure class="loopmap" data-reveal>
    <svg viewBox="0 0 960 520" role="img" aria-labelledby="loopTitle loopDesc">
      <title id="loopTitle" data-i18n="ch1.loop.title"></title>
      <desc id="loopDesc" data-i18n="ch1.loop.desc"></desc>
      <defs>
        <marker id="loopArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="loopmap__head"/></marker>
        <marker id="loopArrowWarm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="loopmap__head loopmap__head--warm"/></marker>
      </defs>

      <!-- 连线 -->
      <path d="M560 142 L738 358" class="loopmap__edge" marker-end="url(#loopArrow)"/>
      <path d="M702 360 L526 146" class="loopmap__edge loopmap__edge--soft" marker-end="url(#loopArrow)"/>
      <path d="M650 428 L314 428" class="loopmap__edge" marker-end="url(#loopArrow)"/>
      <path d="M232 360 L404 146" class="loopmap__edge" marker-end="url(#loopArrow)"/>
      <path d="M355 72 C 150 72, 96 210, 150 356" class="loopmap__edge loopmap__edge--special" marker-end="url(#loopArrowWarm)"/>

      <!-- 连线说明 -->
      <text x="690" y="214" class="loopmap__label" data-i18n="ch1.loop.edge.party"></text>
      <text x="704" y="234" class="loopmap__label" data-i18n="ch1.loop.edge.depart"></text>
      <text x="606" y="300" class="loopmap__label loopmap__label--end" data-i18n="ch1.loop.edge.abandon"></text>
      <text x="606" y="320" class="loopmap__label loopmap__label--end" data-i18n="ch1.loop.edge.mapLoot"></text>
      <text x="482" y="414" class="loopmap__label loopmap__label--mid" data-i18n="ch1.loop.edge.found"></text>
      <text x="266" y="240" class="loopmap__label loopmap__label--end" data-i18n="ch1.loop.edge.bossLoot"></text>
      <text x="280" y="260" class="loopmap__label loopmap__label--end" data-i18n="ch1.loop.edge.plusMap"></text>
      <text x="40" y="34" class="loopmap__label loopmap__label--warm" data-i18n="ch1.loop.edge.special"></text>
      <text x="40" y="54" class="loopmap__label loopmap__label--warm" data-i18n="ch1.loop.edge.specialOutcome"></text>

      <!-- 中心 -->
      <text x="430" y="300" class="loopmap__center" data-i18n="ch1.loop.center"></text>
      <text x="430" y="332" class="loopmap__center-sub" data-i18n="ch1.loop.centerSub"></text>

      <!-- 节点 -->
      <g class="loopmap__node" style="--c: var(--phase-1)">
        <rect x="355" y="30" width="250" height="112" rx="10"/>
        <rect x="355" y="30" width="6" height="112" class="loopmap__bar"/>
        <text x="380" y="68" class="loopmap__name" data-i18n="ch1.loop.settlement.name"></text>
        <text x="434" y="68" class="loopmap__en" data-i18n="ch1.loop.settlement.en"></text>
        <text x="380" y="98" class="loopmap__items" data-i18n="ch1.loop.settlement.items"></text>
        <text x="380" y="124" class="loopmap__share" data-i18n="ch1.loop.settlement.share"></text>
      </g>
      <g class="loopmap__node" style="--c: var(--phase-2)">
        <rect x="650" y="360" width="250" height="124" rx="10"/>
        <rect x="650" y="360" width="6" height="124" class="loopmap__bar"/>
        <text x="675" y="398" class="loopmap__name" data-i18n="ch1.loop.hunt.name"></text>
        <text x="729" y="398" class="loopmap__en" data-i18n="ch1.loop.hunt.en"></text>
        <text x="675" y="426" class="loopmap__items" data-i18n="ch1.loop.hunt.items1"></text>
        <text x="675" y="446" class="loopmap__items" data-i18n="ch1.loop.hunt.items2"></text>
        <text x="675" y="470" class="loopmap__share" data-i18n="ch1.loop.hunt.share"></text>
      </g>
      <g class="loopmap__node" style="--c: var(--phase-3)">
        <rect x="60" y="360" width="254" height="124" rx="10"/>
        <rect x="60" y="360" width="6" height="124" class="loopmap__bar"/>
        <text x="85" y="398" class="loopmap__name" data-i18n="ch1.loop.showdown.name"></text>
        <text x="139" y="398" class="loopmap__en" data-i18n="ch1.loop.showdown.en"></text>
        <text x="85" y="426" class="loopmap__items" data-i18n="ch1.loop.showdown.items1"></text>
        <text x="85" y="446" class="loopmap__items" data-i18n="ch1.loop.showdown.items2"></text>
        <text x="85" y="470" class="loopmap__share" data-i18n="ch1.loop.showdown.share"></text>
      </g>
    </svg>

    <!-- 窄屏用的文字版 -->
    <ol class="looplist">
      <li style="--c: var(--phase-1)"><strong data-i18n="ch1.looplist.settlement.name"></strong><span data-i18n="ch1.looplist.settlement.detail"></span></li>
      <li class="looplist__edge" data-i18n="ch1.looplist.edge1"></li>
      <li style="--c: var(--phase-2)"><strong data-i18n="ch1.looplist.hunt.name"></strong><span data-i18n="ch1.looplist.hunt.detail"></span></li>
      <li class="looplist__edge" data-i18n="ch1.looplist.edge2"></li>
      <li style="--c: var(--phase-3)"><strong data-i18n="ch1.looplist.showdown.name"></strong><span data-i18n="ch1.looplist.showdown.detail"></span></li>
      <li class="looplist__edge" data-i18n="ch1.looplist.edge3"></li>
      <li class="looplist__edge looplist__edge--warm" data-i18n="ch1.looplist.special"></li>
    </ol>
    <figcaption data-i18n="ch1.loop.caption"></figcaption>
  </figure>
</section>

<!-- 阶段 I 营地 -->
<section class="spread spread--art-right page" data-chapter-key="chapter.gameplay">
  <div class="spread__art"><div class="slot slot--bleed" data-asset="G-01" data-label-key="slot.G-01" data-ratio="3/2"></div></div>
  <div class="spread__page">
    <div class="title-block" data-reveal>
      <p class="kicker" data-i18n="ch1.settlement.kicker"></p>
      <h3 class="title-en" data-i18n="ch1.settlement.titleEn"></h3>
      <p class="title-cn" data-i18n="ch1.settlement.titleCn"></p>
    </div>
    <p class="rule-lede" data-i18n="ch1.settlement.lede"></p>
    <ol class="diamonds">
      <li data-i18n="ch1.settlement.1"></li>
      <li data-i18n="ch1.settlement.2"></li>
      <li data-i18n="ch1.settlement.3"></li>
      <li data-i18n="ch1.settlement.4"></li>
    </ol>
  </div>
</section>

<!-- 阶段 II 狩猎 -->
<section class="spread spread--art-left page" data-chapter-key="chapter.gameplay">
  <div class="spread__art"><div class="slot slot--bleed" data-asset="G-02" data-label-key="slot.G-02" data-ratio="3/2"></div></div>
  <div class="spread__page">
    <div class="title-block" data-reveal>
      <p class="kicker" data-i18n="ch1.hunt.kicker"></p>
      <h3 class="title-en" data-i18n="ch1.hunt.titleEn"></h3>
      <p class="title-cn" data-i18n="ch1.hunt.titleCn"></p>
    </div>
    <p class="rule-lede" data-i18n="ch1.hunt.lede"></p>
    <ol class="diamonds">
      <li data-i18n="ch1.hunt.1"></li>
      <li data-i18n="ch1.hunt.2"></li>
      <li data-i18n="ch1.hunt.3"></li>
      <li data-i18n="ch1.hunt.4"></li>
    </ol>
    <aside class="note">
      <p class="note__title" data-i18n="ch1.hunt.note.title"></p>
      <p data-i18n="ch1.hunt.note.body"></p>

</section>

<!-- 阶段 III 决战 -->
<section class="spread spread--art-right page" data-chapter-key="chapter.gameplay">
  <div class="spread__art"><div class="slot slot--bleed" data-asset="G-03" data-label-key="slot.G-03" data-ratio="3/2"></div></div>
  <div class="spread__page">
    <div class="title-block" data-reveal>
      <p class="kicker" data-i18n="ch1.showdown.kicker"></p>
      <h3 class="title-en" data-i18n="ch1.showdown.titleEn"></h3>
      <p class="title-cn" data-i18n="ch1.showdown.titleCn"></p>
    </div>
    <p class="rule-lede" data-i18n="ch1.showdown.lede"></p>
    <ol class="diamonds">
      <li data-i18n="ch1.showdown.1"></li>
      <li data-i18n="ch1.showdown.2"></li>
      <li data-i18n="ch1.showdown.3"></li>

<!-- 核心机制画廊：六个设计支柱，每页一条规则 + 可操作示例 -->
<section class="rules page" data-chapter-key="chapter.gameplay">
  <div class="title-block" data-reveal>
    <p class="kicker" data-i18n="rules.kicker"></p>
    <h3 class="title-en" data-i18n="rules.titleEn"></h3>
    <p class="title-cn" data-i18n="rules.titleCn"></p>
  </div>

  <nav class="rules__index" data-i18n-attr="aria-label:rules.indexLabel">
    <button type="button" data-goto="0" data-i18n="rules.index.1"></button>
    <button type="button" data-goto="1" data-i18n="rules.index.2"></button>
    <button type="button" data-goto="2" data-i18n="rules.index.3"></button>
    <button type="button" data-goto="3" data-i18n="rules.index.4"></button>
    <button type="button" data-goto="4" data-i18n="rules.index.5"></button>
    <button type="button" data-goto="5" data-i18n="rules.index.6"></button>
  </nav>

  <div class="rules__track" id="rulesTrack" tabindex="0" data-i18n-attr="aria-label:rules.trackLabel">

    <!-- 01 翻面行动 -->
    <article class="rule">
      <div class="rule__text">
        <p class="rule__pillar" data-i18n="rules.flip.pillar"></p>
        <h4 class="rule__title" data-i18n="rules.flip.title"></h4>
        <p class="rule-lede" data-i18n="rules.flip.lede"></p>
        <ol class="diamonds">
          <li data-i18n="rules.flip.1"></li>
          <li data-i18n="rules.flip.2"></li>
          <li data-i18n="rules.flip.3"></li>
          <li data-i18n="rules.flip.4"></li>
        </ol>
        <p class="note" data-i18n="rules.flip.note"></p>
      </div>
      <div class="demo demo--flip" id="flipDemo">
        <div class="demo__bar">
          <span><span data-i18n="demo.flip.roundBefore"></span><output id="flipRound" data-i18n-dynamic>1</output><span data-i18n="demo.flip.roundAfter"></span></span>
          <span class="timepips" id="flipTime" data-i18n-dynamic></span>
        </div>
        <div class="acards" id="flipCards" data-i18n-dynamic></div>
        <div class="mind">
          <p class="mind__label" data-i18n="demo.flip.mind"></p>
          <div class="mind__slots" id="flipMind" data-i18n-dynamic></div>
        </div>
        <div class="demo__actions">
          <button type="button" class="btn btn--outline btn--sm" id="flipEnd" data-i18n="demo.flip.end"></button>
          <button type="button" class="btn btn--outline btn--sm" id="flipReset" data-i18n="demo.flip.reset"></button>
        </div>
        <p class="demo__log" id="flipLog" aria-live="polite" data-i18n-dynamic></p>
        <p class="fineprint" data-i18n="demo.flip.fineprint"></p>
      </div>
    </article>

    <!-- 02 抽牌命中（原演示） -->
    <article class="rule">
      <div class="rule__text">
        <p class="rule__pillar" data-i18n="rules.draw.pillar"></p>
        <h4 class="rule__title" data-i18n="rules.draw.title"></h4>
        <p class="rule-lede" data-i18n="rules.draw.lede"></p>
        <ol class="diamonds">
          <li data-i18n="rules.draw.1"></li>
          <li data-i18n="rules.draw.2"></li>
